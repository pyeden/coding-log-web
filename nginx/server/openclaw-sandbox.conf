# OpenClaw 组件沙箱（MCP Apps sandbox）独立 origin
# 原因：Control UI 在 https://seres-ai.com/openclaw，沙箱必须使用「不同 origin」
# 这里用 www.seres-ai.com（同证书已覆盖），路径 /mcp-app-sandbox 反代到本机 18790

server {
    listen       8888 ssl;
    listen  [::]:8888 ssl;
    server_name  www.seres-ai.com;

    ssl_certificate     /Users/mac/coding-log-web/nginx/cert/seres-ai.com.pem;
    ssl_certificate_key /Users/mac/coding-log-web/nginx/cert/seres-ai.com.key;

    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header proxy_protocol;

    # 沙箱监听器（只服务于组件 HTML，不含任何登录态数据）
    location /mcp-app-sandbox {
        proxy_pass http://127.0.0.1:18790;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 其余路径保持原有主站行为，避免影响 www 访问
    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
