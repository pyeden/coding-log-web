# Django+Vue 博客：https://seres-ai.com/djangovueblog/
# 放置于 /Users/mac/coding-log-web/nginx/server/djangovueblog.conf
location = /djangovueblog {
    return 301 /djangovueblog/;
}

# Django API（去掉 /djangovueblog 前缀后转发）
location /djangovueblog/api/ {
    proxy_pass http://127.0.0.1:8899/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    client_max_body_size 20m;
}

# Django 管理后台（可选，仅本机调试时用；不对外暴露也可删掉）
location /djangovueblog/admin/ {
    proxy_pass http://127.0.0.1:8899/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;
}

# 用户上传的媒体文件
location /djangovueblog/media/ {
    alias /Users/mac/djangovueblog-data/media/;
    access_log off;
    expires 7d;
}

# Django collectstatic 产物
location /djangovueblog/static/ {
    alias /Users/mac/djangovueblog-releases/current/staticfiles/;
    access_log off;
    expires 30d;
}

# Vue SPA（dist 内容放在 frontend/djangovueblog/）
location /djangovueblog/ {
    root /Users/mac/djangovueblog-releases/current/frontend;
    try_files $uri $uri/ /djangovueblog/index.html;
    add_header Cache-Control "no-cache";
}

location ~* ^/djangovueblog/assets/ {
    root /Users/mac/djangovueblog-releases/current/frontend;
    expires 30d;
    add_header Cache-Control "public, immutable";
}
