  <rect x="55" y="422" width="210" height="42" rx="6" fill="#e9f7ef" stroke="#2e8b57" stroke-width="1.6"/>
  <text x="160" y="449" font-size="15" text-anchor="middle" fill="#14532d">SWE.3 详细设计与编码</text>

  <!-- 右侧 -->
  <rect x="695" y="132" width="210" height="42" rx="6" fill="#e8f0fe" stroke="#3b6fb6" stroke-width="1.6"/>
  <text x="800" y="159" font-size="15" text-anchor="middle" fill="#16365c">SYS.5 系统合格性测试</text>
  <rect x="695" y="190" width="210" height="42" rx="6" fill="#e8f0fe" stroke="#3b6fb6" stroke-width="1.6"/>
  <text x="800" y="217" font-size="13.5" text-anchor="middle" fill="#16365c">SYS.4 系统集成与集成测试</text>
  <rect x="695" y="306" width="210" height="42" rx="6" fill="#e9f7ef" stroke="#2e8b57" stroke-width="1.6"/>
  <text x="800" y="333" font-size="14" text-anchor="middle" fill="#14532d">SWE.6 软件合格性测试</text>
  <rect x="695" y="364" width="210" height="42" rx="6" fill="#e9f7ef" stroke="#2e8b57" stroke-width="1.6"/>
  <text x="800" y="391" font-size="13.5" text-anchor="middle" fill="#14532d">SWE.5 软件集成与集成测试</text>

