<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="pgArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b98ad"/>
    </marker>
    <marker id="pgArrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6fb6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="690" fill="#ffffff"/>
  <text x="40" y="42" font-size="24" font-weight="700" fill="#1f2937">ASPICE 过程组全景与软件 V 模型</text>

  <rect x="40" y="60" width="880" height="48" rx="8" fill="#eef4ff" stroke="#4a78c2" stroke-width="1.5"/>
  <text x="60" y="90" font-size="15" fill="#1e3a6b">ACQ 获取 / SPL 供应：客户—供应商接口（ACQ.3 合同、ACQ.4 供应商监控、SPL.1 投标、SPL.2 产品发布）</text>

  <text x="52" y="128" font-size="13" fill="#5b6b82">需求、设计与分解</text>
  <text x="812" y="128" font-size="13" fill="#5b6b82">集成、验证与确认</text>

  <polyline points="160,140 480,455 800,140" fill="none" stroke="#b7c2d3" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#pgArrow)"/>
  <line x1="480" y1="455" x2="480" y2="488" stroke="#8b98ad" stroke-width="2" marker-end="url(#pgArrow)"/>

  <!-- 左侧 SYS -->
