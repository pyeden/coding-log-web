  <rect x="40" y="560" width="880" height="46" rx="8" fill="#f5f0ff" stroke="#7c5cbf" stroke-width="1.5"/>
  <text x="58" y="588" font-size="14" fill="#3c2a63">SUP 支持：SUP.1 质量保证 · SUP.4 联合评审 · SUP.7 文档 · SUP.8 配置管理 · SUP.9 问题解决 · SUP.10 变更管理</text>
  <rect x="40" y="614" width="880" height="46" rx="8" fill="#fff5e6" stroke="#c98a1b" stroke-width="1.5"/>
  <text x="58" y="642" font-size="14" fill="#6b4400">MAN 管理：MAN.3 项目管理 · MAN.5 风险管理 · MAN.6 度量　｜　过程改进 PIM.3、复用 REU.2 横向支撑全部过程组</text>

  <text x="40" y="682" font-size="12" fill="#7b8794">过程编号依据 Automotive SPICE 3.1；4.0 的编号与范围以 VDA QMC 最新 PAM 为准</text>
